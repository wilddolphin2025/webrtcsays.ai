# Frame viewer locations for the rtc.wilddolphin.us server.
# Include this file in that server block, immediately after the PR 17
# locations include and above the babelfish include and location /.
# Requires PR 17 head 1dfe20dbc1088e6f51f74e2baf99c1201d23d0e2:
# auth_request location /_demo_auth, named location @demo_login, and
# log_format demo_noargs. Apply deploy/frame-view/auth/demo-auth-view-paths.patch
# on that file so X-Original-URI /demo/view/... is accepted.
# The router listens on 127.0.0.1:3461 only.
# Query strings are stripped before the upstream so a token never arrives there.
# These locations are additive. They leave /demo/, /demo/ws, /demo/turn,
# legacy exact /ws, gateway /ws/, and / alone.

location = /demo/view {
    set $demo_log_uri $uri;
    access_log /var/log/nginx/demo-view.log demo_noargs;
    return 301 /demo/view/frame101;
}

location = /demo/view/assets/view.css {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token "";
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    auth_request /_demo_auth;
    error_page 401 = @demo_login;
    alias /srv/webrtcsays-frame-view/view.css;
    default_type text/css;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/demo-view.log demo_noargs;
}

location = /demo/view/assets/view.js {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token "";
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    auth_request /_demo_auth;
    error_page 401 = @demo_login;
    alias /srv/webrtcsays-frame-view/view.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/demo-view.log demo_noargs;
}

# Rooms named ws and assets are reserved for the socket and stylesheet paths.
location ~ ^/demo/view/(?!ws$|assets$)([A-Za-z0-9][A-Za-z0-9_-]{0,63})$ {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token "";
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    auth_request /_demo_auth;
    error_page 401 = @demo_login;
    alias /srv/webrtcsays-frame-view/index.html;
    default_type text/html;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/demo-view.log demo_noargs;
}

location ~ ^/demo/view/ws/([A-Za-z0-9][A-Za-z0-9_-]{0,63})$ {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token $arg_token;
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    set $args "";
    auth_request /_demo_auth;
    access_log /var/log/nginx/demo-view.log demo_noargs;
    proxy_pass http://127.0.0.1:3461;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Original-URI $demo_orig_uri;
    proxy_set_header X-Demo-Auth "ok";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Demo-Token "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
