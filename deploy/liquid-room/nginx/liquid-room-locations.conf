# LiquidServer room locations for the rtc.wilddolphin.us server block. Phase B.
# Include inside that server block after the frame-view include (or after the
# webrtcsays-demo include), above the babelfish include and above location /.
# Needs, from deploy/webrtcsays-demo: location /_demo_auth, @demo_login,
# log_format demo_noargs, and demo_auth.py with ROOM_PAGE_RE/ROOM_WS_RE.
#
#   page    /demo/room/<room>     -> /srv/liquid-room/index.html (caller page)
#   socket  /demo/room/ws/<room>  -> https://cb.wilddolphin.us/ws/<room>
#
# The socket location authenticates first (cookie, Bearer, or ?token=), then
# drops Authorization, Cookie, X-Demo-Token and the query string, and adds the
# X-Liquid-Gate header from /etc/nginx/liquid-gate.conf (root 0600, not in git):
#     proxy_set_header X-Liquid-Gate "<64 lowercase hex>";
# The upstream certificate is verified against the system CA bundle.
# These locations are additive. /demo/, /demo/ws, /demo/turn, /demo/view/*,
# /ws, /ws/ and / are untouched.

location = /demo/room {
    set $demo_log_uri $uri;
    access_log /var/log/nginx/demo-room.log demo_noargs;
    return 301 /demo/room/room101;
}

# The room label "ws" is reserved for the socket path.
location ~ "^/demo/room/(?!ws$)([A-Za-z0-9][A-Za-z0-9_-]{0,63})$" {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token "";
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    auth_request /_demo_auth;
    error_page 401 = @demo_login;
    alias /srv/liquid-room/index.html;
    default_type text/html;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/demo-room.log demo_noargs;
}

location ~ "^/demo/room/ws/(?<liquid_room>[A-Za-z0-9][A-Za-z0-9_-]{0,63})$" {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token $arg_token;
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    set $args "";
    auth_request /_demo_auth;
    access_log /var/log/nginx/demo-room.log demo_noargs;
    proxy_pass https://liquidserver_ws/ws/$liquid_room;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host cb.wilddolphin.us;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Demo-Token "";
    proxy_set_header X-Original-URI "";
    proxy_set_header X-Real-IP $remote_addr;
    include /etc/nginx/liquid-gate.conf;
    proxy_ssl_server_name on;
    proxy_ssl_name cb.wilddolphin.us;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 5s;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
