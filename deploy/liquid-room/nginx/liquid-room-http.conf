# LiquidServer room upstream for the rtc.wilddolphin.us nginx (http context).
# Install as /etc/nginx/conf.d/liquid-room-http.conf.
# nginx resolves the name at start/reload; `nginx -t` fails while the DNS
# record is missing, which is the safe outcome. Phase B only.
# Primary upstream is cb.wilddolphin.us. Keep live rtc nginx on
# ls.wilddolphin.us until the DevOps cutover after the Nov 25–26 test;
# switch this upstream and any ls. redirect in the same change (WebSocket
# clients may not follow a redirect).
upstream liquidserver_ws {
    server cb.wilddolphin.us:443 max_fails=0;
}
