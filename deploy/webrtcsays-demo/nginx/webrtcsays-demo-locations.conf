# Stage-1 WebRTCSays demo locations for the rtc.wilddolphin.us server.
# Include this file inside that server block, above the babelfish include
# and above location /. Do not replace other server blocks.
#
# directcall's WebSocket listener (examples/direct/main.cc PerformHandshake)
# accepts HTTP/1.1 Upgrade and then raw text frames. It does not read the
# request path and it does not use the TCP 2-byte length prefix on this
# socket. The listener binds 0.0.0.0. nginx is the authenticated front door.
# The rewrite below makes the upstream request line "GET / HTTP/1.1" and
# drops the query string so a ?token= value never reaches the callee.

location = /demo {
    set $demo_log_uri $uri;
    access_log /var/log/nginx/demo-auth.log demo_noargs;
    return 301 /demo/;
}

location = /_demo_auth {
    internal;
    proxy_pass http://127.0.0.1:8793/_demo_auth?;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Original-URI $demo_orig_uri;
    proxy_set_header X-Demo-Token $demo_token;
    proxy_set_header Authorization $auth_header;
    proxy_set_header Cookie $demo_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    access_log /var/log/nginx/demo-auth.log demo_noargs;
}

location = /demo/login {
    set $demo_log_uri $uri;
    limit_req zone=demo_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:8793/demo/login;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header X-Demo-Token "";
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log /var/log/nginx/demo-auth.log demo_noargs;
}

location = /demo/logout {
    set $demo_log_uri $uri;
    limit_req zone=demo_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:8793/demo/logout;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header X-Demo-Token "";
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log /var/log/nginx/demo-auth.log demo_noargs;
}

location = /demo/turn {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token $arg_token;
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    set $args "";
    auth_request /_demo_auth;
    error_page 401 = @demo_login;
    proxy_pass http://127.0.0.1:8793/demo/turn?;
    proxy_set_header Host $http_host;
    proxy_set_header X-Original-URI $demo_orig_uri;
    proxy_set_header X-Demo-Token $demo_token;
    proxy_set_header Authorization $auth_header;
    proxy_set_header Cookie $demo_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log /var/log/nginx/demo-auth.log demo_noargs;
}

location = /demo/ws {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token $arg_token;
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    set $args "";
    rewrite ^ /? break;
    auth_request /_demo_auth;
    access_log /var/log/nginx/demo-ws.log demo_noargs;
    proxy_pass http://127.0.0.1:3459;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Demo-Token "";
    proxy_set_header X-Original-URI "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /ws {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token $arg_token;
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    set $args "";
    rewrite ^ /? break;
    auth_request /_demo_auth;
    access_log /var/log/nginx/demo-ws.log demo_noargs;
    proxy_pass http://127.0.0.1:3459;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Demo-Token "";
    proxy_set_header X-Original-URI "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /demo/ {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token "";
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    auth_request /_demo_auth;
    error_page 401 = @demo_login;
    root /srv/webrtcsays-demo;
    try_files /index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/demo-auth.log demo_noargs;
}

location = /demo/index.html {
    set $demo_log_uri $uri;
    set $demo_orig_uri $uri;
    set $demo_token "";
    set $auth_header $http_authorization;
    set $demo_cookie $http_cookie;
    auth_request /_demo_auth;
    error_page 401 = @demo_login;
    root /srv/webrtcsays-demo;
    try_files /index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/demo-auth.log demo_noargs;
}

location @demo_login {
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log /var/log/nginx/demo-auth.log demo_noargs;
    return 302 /demo/login?next=$demo_log_uri;
}
