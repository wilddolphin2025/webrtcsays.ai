# LiquidServer room upstream for the rtc.wilddolphin.us nginx (http context).
# Install as /etc/nginx/conf.d/liquid-room-http.conf.
# nginx resolves the name at start/reload; `nginx -t` fails while the DNS
# record is missing, which is the safe outcome. Phase B only.
upstream liquidserver_ws {
    server liquidserver.wilddolphin.us:443 max_fails=0;
}
