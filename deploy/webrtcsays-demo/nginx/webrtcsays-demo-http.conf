# HTTP-context settings for the stage-1 demo. Install as
# /etc/nginx/conf.d/webrtcsays-demo-http.conf (included from http {}).
# Do not add $request, $args, $query_string, $http_authorization, or
# $http_cookie to this format. $request includes the query string.

limit_req_zone $binary_remote_addr zone=demo_login:1m rate=10r/m;
limit_req_status 429;

log_format demo_noargs '$remote_addr - [$time_local] "$request_method $demo_log_uri" $status $body_bytes_sent';
